name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as aarav@edugap.demo
        2. Open …
        3. Click …
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Which role were you using?
      options: [Student, Teacher, Administrator, Not signed in]
  - type: dropdown
    id: ai
    attributes:
      label: AI mode
      options: [Offline (no API key), Claude enabled, Not sure]
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Browser, OS, Node version, local dev / Docker / deployed"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
