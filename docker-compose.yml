# Production-like stack: the app plus PostgreSQL.
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up --build
# then open http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: edugap
      POSTGRES_PASSWORD: edugap
      POSTGRES_DB: edugap
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edugap"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://edugap:edugap@db:5432/edugap
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Loads the demo accounts on first start. Remove for a real deployment.
      SEED_DEMO_DATA: "true"

volumes:
  db-data:
